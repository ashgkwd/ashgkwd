<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 220" width="880" height="220" role="img" aria-labelledby="t d">
  <title id="t">A friendly green agent floating along a guardrail with three checkpoints</title>
  <desc id="d">A round green agent with a glowing antenna moves along a guardrail. Three checkpoints on the rail show a check mark for verify, a lock for control and a loop for operate.</desc>
  <style>
    .bob { animation: bob 4.2s ease-in-out infinite; }
    .shadow { animation: shadow 4.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .eyes { animation: blink 5.5s infinite; transform-box: fill-box; transform-origin: center; }
    .sway { animation: sway 3.4s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
    .glow { animation: glow 2.4s ease-in-out infinite; }
    .flow { animation: flow 1.4s linear infinite; }
    .packet { animation: packet 4.8s ease-in-out infinite; }
    .node { animation: node 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .ring { animation: ring 2.4s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    .n2, .n2r { animation-delay: .8s; }
    .n3, .n3r { animation-delay: 1.6s; }
    .spark { animation: twinkle 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .s2 { animation-delay: 1s; } .s3 { animation-delay: 2s; } .s4 { animation-delay: .5s; }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
    @keyframes shadow { 0%, 100% { transform: scaleX(1); opacity: .35; } 50% { transform: scaleX(.86); opacity: .22; } }
    @keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.08); } }
    @keyframes sway { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(5deg); } }
    @keyframes glow { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
    @keyframes flow { to { stroke-dashoffset: -28; } }
    @keyframes packet { 0% { transform: translateX(0); opacity: 0; } 12% { opacity: 1; } 88% { opacity: 1; } 100% { transform: translateX(560px); opacity: 0; } }
    @keyframes node { 0%, 70%, 100% { transform: scale(1); } 20% { transform: scale(1.14); } }
    @keyframes ring { 0% { transform: scale(1); opacity: .55; } 45%, 100% { transform: scale(1.7); opacity: 0; } }
    @keyframes twinkle { 0%, 100% { opacity: .25; transform: scale(.7); } 50% { opacity: .95; transform: scale(1.1); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d4c6b" /><stop offset=".55" stop-color="#22577a" /><stop offset="1" stop-color="#2f8f94" />
    </linearGradient>
    <radialGradient id="aura" cx="85%" cy="100%" r="70%"><stop offset="0" stop-color="#57cc99" stop-opacity=".45" /><stop offset="1" stop-color="#57cc99" stop-opacity="0" /></radialGradient>
    <radialGradient id="shell" cx="38%" cy="25%" r="85%"><stop offset="0" stop-color="#d9fbdc" /><stop offset=".45" stop-color="#80ed99" /><stop offset="1" stop-color="#38a3a5" /></radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a6d90" /><stop offset="1" stop-color="#15405a" /></linearGradient>
    <radialGradient id="bulb" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#ffffff" /><stop offset=".5" stop-color="#c7f9cc" /><stop offset="1" stop-color="#80ed99" /></radialGradient>
    <radialGradient id="shadowg" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#0d2c40" stop-opacity=".7" /><stop offset="1" stop-color="#0d2c40" stop-opacity="0" /></radialGradient>
    <symbol id="star" viewBox="-30 -30 60 60"><path d="M0 -26 L6 -6 L26 0 L6 6 L0 26 L-6 6 L-26 0 L-6 -6z" /></symbol>
  </defs>

  <rect width="880" height="220" rx="18" fill="url(#bg)" />
  <rect width="880" height="220" rx="18" fill="url(#aura)" />

  <g fill="#c7f9cc">
    <use class="spark" href="#star" x="236" y="26" width="26" height="26" />
    <use class="spark s2" href="#star" x="470" y="22" width="18" height="18" />
    <use class="spark s3" href="#star" x="826" y="40" width="24" height="24" />
    <use class="spark s4" href="#star" x="660" y="188" width="16" height="16" />
  </g>

  <!-- guardrail: two rails with posts -->
  <g stroke="#c7f9cc" stroke-linecap="round">
    <line x1="250" y1="102" x2="850" y2="102" stroke-opacity=".28" stroke-width="3" />
    <line x1="250" y1="138" x2="850" y2="138" stroke-opacity=".28" stroke-width="3" />
    <line class="flow" x1="250" y1="102" x2="850" y2="102" stroke-opacity=".7" stroke-width="3" stroke-dasharray="6 22" />
    <line class="flow" x1="250" y1="138" x2="850" y2="138" stroke-opacity=".7" stroke-width="3" stroke-dasharray="6 22" />
    <path d="M290 94v52M330 94v52M430 94v52M470 94v52M610 94v52M650 94v52M790 94v52M830 94v52" stroke-opacity=".3" stroke-width="3" />
  </g>

  <!-- the agent: a glossy squircle with a face screen and a glowing antenna -->
  <ellipse class="shadow" cx="150" cy="198" rx="70" ry="9" fill="url(#shadowg)" />
  <g class="bob">
    <g class="sway">
      <path d="M150 66 V34" fill="none" stroke="#c7f9cc" stroke-width="5" stroke-linecap="round" />
      <path d="M150 52 C162 40 178 38 186 44 C180 58 164 62 150 52z" fill="#80ed99" />
      <circle class="glow" cx="150" cy="28" r="15" fill="#80ed99" opacity=".5" />
      <circle cx="150" cy="28" r="8.5" fill="url(#bulb)" />
    </g>
    <circle cx="78" cy="128" r="11" fill="#57cc99" /><circle cx="222" cy="128" r="11" fill="#57cc99" />
    <rect x="80" y="62" width="140" height="130" rx="58" fill="url(#shell)" />
    <ellipse cx="116" cy="88" rx="26" ry="14" fill="#fff" opacity=".35" transform="rotate(-18 116 88)" />
    <rect x="97" y="88" width="106" height="78" rx="36" fill="url(#screen)" />
    <rect x="97" y="88" width="106" height="78" rx="36" fill="none" stroke="#c7f9cc" stroke-opacity=".35" stroke-width="2" />
    <ellipse cx="108" cy="146" rx="13" ry="8" fill="#80ed99" opacity=".35" />
    <ellipse cx="192" cy="146" rx="13" ry="8" fill="#80ed99" opacity=".35" />
    <g class="eyes">
      <ellipse cx="127" cy="123" rx="11" ry="14" fill="#c7f9cc" /><ellipse cx="173" cy="123" rx="11" ry="14" fill="#c7f9cc" />
      <ellipse cx="130" cy="118" rx="4.2" ry="5.2" fill="#fff" /><ellipse cx="176" cy="118" rx="4.2" ry="5.2" fill="#fff" />
      <circle cx="122" cy="129" r="2" fill="#fff" opacity=".8" /><circle cx="168" cy="129" r="2" fill="#fff" opacity=".8" />
    </g>
    <path d="M140 148 C146 155 154 155 160 148" fill="none" stroke="#c7f9cc" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- a packet of work travelling the rail -->
  <g class="packet"><circle cx="262" cy="120" r="5" fill="#c7f9cc" /><circle class="glow" cx="262" cy="120" r="10" fill="#80ed99" opacity=".5" /></g>

  <!-- three checkpoints: verify, control, operate (the outer group positions, the inner one animates) -->
  <g transform="translate(380 120)">
    <circle class="ring" r="27" fill="none" stroke="#80ed99" stroke-width="3" />
    <g class="node">
      <circle r="27" fill="#c7f9cc" /><circle r="27" fill="none" stroke="#80ed99" stroke-width="3" />
      <path d="M-11 1 L-3 9 L12 -9" fill="none" stroke="#22577a" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>
  <g transform="translate(560 120)">
    <circle class="ring n2r" r="27" fill="none" stroke="#80ed99" stroke-width="3" />
    <g class="node n2">
      <circle r="27" fill="#c7f9cc" /><circle r="27" fill="none" stroke="#80ed99" stroke-width="3" />
      <rect x="-10" y="-2" width="20" height="15" rx="3.5" fill="#22577a" />
      <path d="M-6.5 -2 V-7 a6.5 6.5 0 0 1 13 0 V-2" fill="none" stroke="#22577a" stroke-width="4.2" stroke-linecap="round" />
      <circle cy="5" r="2.4" fill="#c7f9cc" />
    </g>
  </g>
  <g transform="translate(740 120)">
    <circle class="ring n3r" r="27" fill="none" stroke="#80ed99" stroke-width="3" />
    <g class="node n3">
      <circle r="27" fill="#c7f9cc" /><circle r="27" fill="none" stroke="#80ed99" stroke-width="3" />
      <path d="M10 -4 A11 11 0 1 0 8 8" fill="none" stroke="#22577a" stroke-width="4.5" stroke-linecap="round" />
      <path d="M13 -13 L14 0 L1 -3z" fill="#22577a" />
    </g>
  </g>
</svg>
